name: Build and deploy site

# Runs automatically on every push to main (the live site) AND whenever a
# pull request targets main. The PR run builds and uploads a preview
# artifact you can download and check — it never deploys. Only a push to
# main (i.e. merging the PR) triggers the actual deploy step.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tooling
        run: npm install

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Pre-render the site
        run: npm run prerender

      - name: Upload preview (for you to download and check)
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
